spring.application.name=LAF
server.port=8080

# Base LLM narration settings (used by POST /api/graph/process)
laf.narration.llm.enabled=true
laf.narration.llm.base-url=https://api.openai.com/v1/chat/completions
laf.narration.llm.api-key=${OPENAI_API_KEY:}
laf.narration.llm.model=gpt-4o-mini
laf.narration.llm.prompt-version=narrative-v1
laf.narration.llm.timeout-ms=15000
laf.narration.llm.temperature=0.2
